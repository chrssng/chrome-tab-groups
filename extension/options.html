<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Texts: data-i18n* → _locales/<language>/messages.json, filled in by localize() in ui/dom.js -->
  <title data-i18n="optionsTitle"></title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="ui/shared.css">
  <link rel="stylesheet" href="ui/options.css">
</head>
<body>
  <div class="page">
    <header class="page-head">
      <img src="icons/icon128.png" alt="" width="48" height="48">
      <div>
        <h1 data-i18n="extName"></h1>
        <p class="lede" data-i18n="optionsLede"></p>
      </div>
    </header>

    <div id="external-change" class="banner" role="status" hidden>
      <span data-i18n="externalChange"></span>
      <button type="button" class="btn" id="reload" data-i18n="reload"></button>
    </div>

    <section class="panel" aria-labelledby="h-groups">
      <div class="panel-head">
        <div>
          <h2 id="h-groups" data-i18n="groupsHeading"></h2>
          <p class="panel-sub" data-i18n-html="groupsSub"></p>
        </div>
        <button type="button" class="btn ghost small" id="collapse-all"></button>
      </div>

      <div id="groups" class="sections" data-i18n-attr="aria-label: groupsHeading"></div>

      <div class="add-row">
        <button type="button" class="btn primary" id="add-group"></button>
        <button type="button" class="btn" id="add-category"></button>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-test">
      <h2 id="h-test" data-i18n="testHeading"></h2>
      <p class="panel-sub" data-i18n="testSub"></p>
      <div class="test-row">
        <label class="sr-only" for="test-url" data-i18n="testLabel"></label>
        <input class="input" id="test-url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
               data-i18n-attr="placeholder: testPlaceholder">
      </div>
      <div id="test-result" class="test-result" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="h-behaviour">
      <h2 id="h-behaviour" data-i18n="behaviorHeading"></h2>
      <div class="settings">
        <label class="switch setting">
          <input type="checkbox" id="set-enabled">
          <span class="track" aria-hidden="true"></span>
          <span class="setting-text">
            <span class="setting-title" data-i18n="setEnabledTitle"></span>
            <span class="setting-sub" data-i18n="setEnabledSub"></span>
          </span>
        </label>
        <label class="switch setting">
          <input type="checkbox" id="set-ungroup">
          <span class="track" aria-hidden="true"></span>
          <span class="setting-text">
            <span class="setting-title" data-i18n="setUngroupTitle"></span>
            <span class="setting-sub" data-i18n="setUngroupSub"></span>
          </span>
        </label>
        <label class="switch setting">
          <input type="checkbox" id="set-list-order">
          <span class="track" aria-hidden="true"></span>
          <span class="setting-text">
            <span class="setting-title" data-i18n="setListOrderTitle"></span>
            <span class="setting-sub" data-i18n="setListOrderSub"></span>
          </span>
        </label>
      </div>
      <div class="sort-row">
        <button type="button" class="btn" id="sort-all"></button>
        <span class="muted small" data-i18n="sortAllHint"></span>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-syntax">
      <details class="syntax">
        <summary><h2 id="h-syntax" data-i18n="syntaxHeading"></h2></summary>
        <table>
          <thead><tr><th scope="col" data-i18n="syntaxPattern"></th><th scope="col" data-i18n="syntaxMatches"></th></tr></thead>
          <tbody>
            <tr><td><code>github.com</code></td><td data-i18n="syntaxDomain"></td></tr>
            <tr><td><code>*.atlassian.net</code></td><td data-i18n-html="syntaxSubdomains"></td></tr>
            <tr><td><code>github.com/my-company</code></td><td data-i18n="syntaxPath"></td></tr>
            <tr><td><code>github.com/*/issues</code></td><td data-i18n-html="syntaxWildcard"></td></tr>
            <tr><td><code>localhost:3000</code></td><td data-i18n="syntaxPort"></td></tr>
            <tr><td><code>https://intranet.example.com/wiki</code></td><td data-i18n-html="syntaxScheme"></td></tr>
            <tr><td><code>/\.pdf$/i</code></td><td data-i18n="syntaxRegex"></td></tr>
            <tr><td><code>!mail.google.com</code></td><td data-i18n="syntaxExclusion"></td></tr>
            <tr><td><code># note</code></td><td data-i18n="syntaxComment"></td></tr>
          </tbody>
        </table>
        <p class="muted small" data-i18n-html="syntaxNote"></p>
        <h3 class="syntax-sub" data-i18n="pagesToOpen"></h3>
        <p class="muted small" data-i18n-html="syntaxOpen"></p>
      </details>
    </section>

    <section class="panel" aria-labelledby="h-backup">
      <h2 id="h-backup" data-i18n="backupHeading"></h2>
      <p class="panel-sub" data-i18n="backupSub"></p>
      <div class="backup-row">
        <button type="button" class="btn" id="export"></button>
        <button type="button" class="btn" id="import"></button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
        <button type="button" class="btn danger" id="reset"></button>
      </div>
    </section>
  </div>

  <dialog class="dialog" id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-summary">
    <form method="dialog">
      <h2 id="reset-title" data-i18n="resetTitle"></h2>
      <p class="dialog-sub" id="reset-summary" data-i18n="resetSummary"></p>
      <p class="dialog-sub" data-i18n-html="resetSync"></p>
      <div class="dialog-foot">
        <span class="muted small" data-i18n="nothingUntilSave"></span>
        <span class="dialog-actions">
          <button type="submit" class="btn ghost" value="cancel" autofocus data-i18n="cancel"></button>
          <button type="submit" class="btn danger" value="reset" data-i18n="reset"></button>
        </span>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="import-dialog" aria-labelledby="import-title" aria-describedby="import-summary">
    <form method="dialog">
      <h2 id="import-title" data-i18n="importTitle"></h2>
      <p class="dialog-sub" id="import-summary"></p>
      <div class="choices">
        <button type="submit" class="choice" value="add">
          <span class="choice-title" data-i18n="importAddTitle"></span>
          <span class="choice-sub" data-i18n="importAddSub"></span>
        </button>
        <button type="submit" class="choice danger" value="replace">
          <span class="choice-title" data-i18n="importReplaceTitle"></span>
          <span class="choice-sub" data-i18n="importReplaceSub"></span>
        </button>
      </div>
      <div class="dialog-foot">
        <span class="muted small" data-i18n="nothingUntilSave"></span>
        <button type="submit" class="btn ghost" value="cancel" data-i18n="cancel"></button>
      </div>
    </form>
  </dialog>

  <div class="savebar" id="savebar" aria-hidden="true">
    <div class="savebar-inner">
      <span class="savebar-text" id="savebar-text"></span>
      <button type="button" class="btn ghost" id="discard" data-i18n="discard"></button>
      <button type="button" class="btn primary" id="save" data-i18n="save"></button>
    </div>
  </div>

  <script type="module" src="ui/options.js"></script>
</body>
</html>
